name: Apply v4.21 source corrections
on:
  push:
    branches: [audit/v4.21-stability]
    paths: [scripts/apply-v421.py, .github/workflows/apply-v421.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Patch app
        run: python3 scripts/apply-v421.py
      - name: Validate JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text()
          scripts=re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s)
          Path('/tmp/beast-v421.js').write_text('\n'.join(scripts))
          PY
          node --check /tmp/beast-v421.js
      - name: Commit app update to audit branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "fix: apply v4.21 source corrections"
          git push
