name: Build & validate v4.29 illustrated themes
on:
  push:
    branches: [feature/v429-illustrated-motion]
    paths: [scripts/apply-v429.py, .github/workflows/build-v429.yml, cultural-art.js, cultural-art.css]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python3 scripts/apply-v429.py
      - name: Validate scripts and integration
        run: |
          node --check cultural-art.js
          node --check cultural-theme.js
          node --check sw.js
          python3 - <<'PY'
          import re
          from pathlib import Path
          s=Path('index.html').read_text()
          assert s.count('cultural-art.css?v=429') == 1
          assert s.count('cultural-art.js?v=429') == 1
          assert s.count("document.dispatchEvent(new CustomEvent('beast:prediction-start'))") == 1
          assert s.count('v4.29') >= 1
          js='\n'.join(re.findall(r'<script(?:\s[^>]*)?>([\s\S]*?)</script>',s))
          assert js
          Path('/tmp/beast-main.js').write_text(js)
          PY
          node --check /tmp/beast-main.js
      - name: Commit updated main app
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "feat: enable v4.29 illustrated motion in main app" && git pull --rebase origin feature/v429-illustrated-motion && git push)
