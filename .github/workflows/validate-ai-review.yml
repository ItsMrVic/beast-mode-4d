name: Validate AI Prediction Review
on:
  push:
    paths:
      - "index.html"
      - "ai-prediction-review-v442.js"
      - "ai-backend/worker.js"
      - "scripts/check-ai-review.mjs"
      - ".github/workflows/validate-ai-review.yml"
  pull_request:
    paths:
      - "index.html"
      - "ai-prediction-review-v442.js"
      - "ai-backend/worker.js"
      - "scripts/check-ai-review.mjs"
      - ".github/workflows/validate-ai-review.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/check-ai-review.mjs
      - run: node scripts/check-ai-brain.mjs
