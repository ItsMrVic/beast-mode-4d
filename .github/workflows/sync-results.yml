name: Sync verified 4D results
on:
  schedule:
    - cron: '7,22,37,52 11-15 * * *'
  workflow_dispatch:
  push:
    branches: [main, fix/v4.24-live-results]
    paths: [.github/workflows/sync-results.yml, scripts/sync-results.py]
permissions:
  contents: write
concurrency:
  group: verified-4d-results
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch and validate results
        run: python3 scripts/sync-results.py
      - name: Commit new verified results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/verified-results.json
          git diff --cached --quiet || (git commit -m "data: sync verified Malaysian 4D results" && git push)
